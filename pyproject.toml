[project]
name = "second_brain_gemini"
version = "0.1.0"
description = "Local Second Brain system using Gemini + Pydantic AI + RAG + Memory"
authors = [{ name = "Your Name" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "google-generativeai>=0.6.0",
    "chromadb>=0.5.5",
    "typer>=0.12.3",
    "python-dotenv>=1.0.1",
    "pydantic-ai>=0.5.0",
    "pydantic-evals>=0.1.2",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "presidio-analyzer>=2.1.0",
    "presidio-anonymizer>=2.1.0",
    "spacy>=3.0.0",
    "guardrails-ai>=0.6.7",  # optional for extra schema/PII validators from Guardrails hub
    "rich>=13.0.0",
    "fastmcp>=0.2.0",
    "httpx>=0.27.0"
]

[tool.typer]
app = "main:app"

# optional: ensures uv picks up this project when syncing
[tool.uv]
managed = true
